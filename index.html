  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #f2f4f6;

      --line: rgba(255,255,255,.22);
    }

    html, body {
      height: 100%;

    }

    body {

    /* ===== MOSAIK-HINTERGRUND ===== */
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }

    .mosaic {
      position: absolute;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      z-index: 0;
      display: grid;
      grid-template-columns: repeat(var(--mosaic-cols, 12), 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 3px;
      animation: mosaicDrift 60s linear infinite;
      opacity: 0;
      transition: opacity 1.4s ease;
      background: #0a0a0a;
    }

    .mosaic.loaded { opacity: 1; }

    .mosaic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 2px;
      filter: brightness(.6) saturate(.9);
    }

    @keyframes mosaicDrift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-2%, -1%); }
      50%  { transform: translate(-1%, -2%); }
      75%  { transform: translate(-2%, -1%); }
      100% { transform: translate(0, 0); }
    }

    /* Abdunkelung + Vignette */
    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.58);
      z-index: 1;
      pointer-events: none;
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 45%, rgba(0,119,255,.10) 0%, transparent 55%),
        radial-gradient(circle at 80% 55%, rgba(233,64,142,.07) 0%, transparent 55%),
        linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 28%, transparent 68%, rgba(0,0,0,.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 600px)  { .mosaic { --mosaic-cols: 6; gap: 2px; } }
    @media (min-width: 601px) and (max-width: 900px)  { .mosaic { --mosaic-cols: 9; } }
    @media (min-width: 901px) and (max-width: 1400px) { .mosaic { --mosaic-cols: 12; } }
    @media (min-width: 1401px) { .mosaic { --mosaic-cols: 15; } }

    /* ===== INHALT ===== */
    .cover {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px;
      max-width: 780px;
      animation: fadeUp 1.2s ease .2s both;
    }

    @keyframes fadeUp {

      to   { opacity: 1; transform: none; }
    }

    .wordmark {

    .actions {

<!-- Eingefrorener Video-Bestand – dient nur noch als Bildquelle fuer das Mosaik -->
<script src="videos-config.js"></script>
<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Mosaik aufbauen ---- */
  var mosaic = document.getElementById('mosaic');
  var REIHEN = 6;

  if (window.VIDEOS && mosaic) {
    var ids = [];
    ['winter', 'fruehling', 'sommer', 'herbst', 'ki'].forEach(function (cat) {
      (window.VIDEOS[cat] || []).forEach(function (v) {
        var id = v.id || (v.url ? v.url.split('/').pop() : '');
        if (id) ids.push(id);
      });
    });

    if (ids.length) {
      for (var i = ids.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
      }

      var geladen = 0;
      var zeigen = function () { if (++geladen >= 10) mosaic.classList.add('loaded'); };

      var kachel = function (id) {
        var img = document.createElement('img');
        img.src = 'https://vumbnail.com/' + id + '.jpg';
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onload = zeigen;
        img.onerror = function () { this.style.background = '#1a1a1a'; zeigen(); };
        return img;
      };

      var spaltenZahl = function () {
        var w = window.innerWidth;
        return w <= 600 ? 6 : w <= 900 ? 9 : w <= 1400 ? 12 : 15;
      };

      // Die Spaltenzahl steht auch im CSS. Beim Zoomen oder Fenstergroesse-Aendern
      // wechselt das CSS aber allein — ohne Nachschub blieben die unteren Reihen
      // leer. Deshalb gibt hier das Skript die Spalten vor und legt Kacheln nach.
      var spalten = 0;

      var anpassen = function () {
        var s = spaltenZahl();
        if (s === spalten) return;
        spalten = s;
        mosaic.style.setProperty('--mosaic-cols', s);

        var soll = s * REIHEN;
        while (mosaic.childElementCount > soll) mosaic.removeChild(mosaic.lastElementChild);

        if (mosaic.childElementCount < soll) {
          var frag = document.createDocumentFragment();
          for (var k = mosaic.childElementCount; k < soll; k++) frag.appendChild(kachel(ids[k % ids.length]));
          mosaic.appendChild(frag);
        }
      };

      anpassen();
      setTimeout(function () { mosaic.classList.add('loaded'); }, 2000);

      var warten;
      window.addEventListener('resize', function () {
        clearTimeout(warten);
        warten = setTimeout(anpassen, 150);
      });
    }
  }

  /* ---- Instagram: am Handy die App oeffnen ----
     Im Browser schickt Instagram jeden ausgeloggten Besucher auf seine Login-Wand.
     Ist die App installiert, umgeht der Sprung ueber das instagram://-Schema das.
     Passiert nichts (App fehlt), uebernimmt nach kurzer Wartezeit der normale Link. */
  var insta = document.querySelector('.btn-insta');

  if (insta && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    insta.addEventListener('click', function (e) {
      e.preventDefault();
      var web = this.href, weg = false;
      var merken = function () { weg = true; };
      document.addEventListener('visibilitychange', merken, { once: true });
      window.addEventListener('pagehide', merken, { once: true });
      window.location.href = 'instagram://user?username=walserfly';
      setTimeout(function () { if (!weg) window.location.href = web; }, 1200);
    });
  }

})();
</script>
